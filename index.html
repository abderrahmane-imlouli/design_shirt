<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Design Your Shirt</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="brand-icon">DS</div>

        <div>
            <h1>Design Your Shirt</h1>
            <span>Create your own style</span>
        </div>
    </div>

    <div class="top-actions">

        <button id="clear-design" class="btn btn-secondary">
            Clear
        </button>

        <button id="download-design" class="btn btn-primary">
            Download Design
        </button>

    </div>

</header>


<main class="designer">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <!-- SHIRT -->

        <section class="panel">

            <div class="panel-title">
                <span>👕</span>
                <h2>T-Shirt</h2>
            </div>


            <label class="control-label">
                Size
            </label>

            <div class="size-options">

                <button class="size-btn" data-size="XS">
                    XS
                </button>

                <button class="size-btn" data-size="S">
                    S
                </button>

                <button class="size-btn active" data-size="M">
                    M
                </button>

                <button class="size-btn" data-size="L">
                    L
                </button>

                <button class="size-btn" data-size="XL">
                    XL
                </button>

                <button class="size-btn" data-size="XXL">
                    XXL
                </button>

            </div>


            <label class="control-label color-label">
                Shirt Color
            </label>

            <div class="color-options" id="shirt-colors">

                <button
                    class="color-btn active"
                    data-color="#ffffff"
                    style="--color:#ffffff">
                </button>

                <button
                    class="color-btn"
                    data-color="#111111"
                    style="--color:#111111">
                </button>

                <button
                    class="color-btn"
                    data-color="#ef4444"
                    style="--color:#ef4444">
                </button>

                <button
                    class="color-btn"
                    data-color="#f97316"
                    style="--color:#f97316">
                </button>

                <button
                    class="color-btn"
                    data-color="#f59e0b"
                    style="--color:#f59e0b">
                </button>

                <button
                    class="color-btn"
                    data-color="#22c55e"
                    style="--color:#22c55e">
                </button>

                <button
                    class="color-btn"
                    data-color="#06b6d4"
                    style="--color:#06b6d4">
                </button>

                <button
                    class="color-btn"
                    data-color="#2563eb"
                    style="--color:#2563eb">
                </button>

                <button
                    class="color-btn"
                    data-color="#7c3aed"
                    style="--color:#7c3aed">
                </button>

                <button
                    class="color-btn"
                    data-color="#ec4899"
                    style="--color:#ec4899">
                </button>

                <button
                    class="color-btn"
                    data-color="#92400e"
                    style="--color:#92400e">
                </button>

                <button
                    class="color-btn"
                    data-color="#6b7280"
                    style="--color:#6b7280">
                </button>

            </div>

        </section>


        <!-- TEXT -->

        <section class="panel">

            <div class="panel-title">
                <span>✏️</span>
                <h2>Text</h2>
            </div>


            <label class="control-label">
                Text
            </label>

            <div class="input-row">

                <input
                    type="text"
                    id="text"
                    class="input"
                    placeholder="Enter your text..."
                    maxlength="40"
                >

                <button id="add-text" class="add-btn">
                    +
                </button>

            </div>


            <label class="control-label color-label">
                Text Color
            </label>

            <div class="color-options" id="text-colors">

                <button
                    class="color-btn text-color active"
                    data-color="#111111"
                    style="--color:#111111">
                </button>

                <button
                    class="color-btn text-color"
                    data-color="#ffffff"
                    style="--color:#ffffff">
                </button>

                <button
                    class="color-btn text-color"
                    data-color="#ef4444"
                    style="--color:#ef4444">
                </button>

                <button
                    class="color-btn text-color"
                    data-color="#f97316"
                    style="--color:#f97316">
                </button>

                <button
                    class="color-btn text-color"
                    data-color="#f59e0b"
                    style="--color:#f59e0b">
                </button>

                <button
                    class="color-btn text-color"
                    data-color="#22c55e"
                    style="--color:#22c55e">
                </button>

                <button
                    class="color-btn text-color"
                    data-color="#06b6d4"
                    style="--color:#06b6d4">
                </button>

                <button
                    class="color-btn text-color"
                    data-color="#2563eb"
                    style="--color:#2563eb">
                </button>

                <button
                    class="color-btn text-color"
                    data-color="#7c3aed"
                    style="--color:#7c3aed">
                </button>

                <button
                    class="color-btn text-color"
                    data-color="#ec4899"
                    style="--color:#ec4899">
                </button>

            </div>

        </section>


        <!-- IMAGE -->

        <section class="panel">

            <div class="panel-title">
                <span>🖼️</span>
                <h2>Image</h2>
            </div>


            <label class="upload-box">

                <div class="upload-icon">
                    ↑
                </div>

                <strong>
                    Upload image
                </strong>

                <span>
                    PNG, JPG or WEBP
                </span>

                <input
                    type="file"
                    id="image-upload"
                    accept="image/png,image/jpeg,image/webp"
                    hidden
                >

            </label>

        </section>


        <!-- SELECTED ELEMENT CONTROLS -->

        <section
            class="panel selected-controls"
            id="selected-controls"
        >

            <div class="panel-title">
                <span>⚙️</span>
                <h2>Selected Element</h2>
            </div>


            <div class="control-group">

                <div class="control-header">
                    <span>Size</span>

                    <strong id="scale-value">
                        100%
                    </strong>
                </div>


                <div class="scale-controls">

                    <button id="scale-down">
                        −
                    </button>

                    <input
                        type="range"
                        id="scale-slider"
                        min="30"
                        max="250"
                        value="100"
                    >

                    <button id="scale-up">
                        +
                    </button>

                </div>

            </div>


            <div class="control-group">

                <div class="control-header">
                    <span>Rotation</span>

                    <strong id="rotation-value">
                        0°
                    </strong>
                </div>


                <input
                    type="range"
                    id="rotation-slider"
                    min="-180"
                    max="180"
                    value="0"
                >

            </div>


            <button
                id="delete-selected"
                class="delete-btn"
            >
                Delete Element
            </button>

        </section>

    </aside>


    <!-- WORKSPACE -->

    <section class="workspace">

        <div class="workspace-header">

            <div>
                <h2>Your Design</h2>

                <p>
                    Customize your shirt and make it yours.
                </p>
            </div>


            <div class="status">

                <span class="status-dot"></span>

                Ready

            </div>

        </div>


        <div class="canvas-area">

            <div
                id="canvas-container"
                class="canvas-container"
            >

                <canvas id="tshirt-canvas"></canvas>

                <div id="elements-layer"></div>

            </div>

        </div>


        <div class="workspace-footer">

            <span>
                Drag elements to position them
            </span>

            <span>
                Delete = remove selected element
            </span>

        </div>

    </section>

</main>


<div id="toast" class="toast"></div>


<script src="js/scripts.js"></script>

</body>
</html>
